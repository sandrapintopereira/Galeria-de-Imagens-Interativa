<!DOCTYPE html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Galeria</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <header>
        <h1 class="titulo-principal">Galeria de Imagens</h1>
    </header>
    <body>
    <main class="parede">
        <div class="galeria">
            <article class="imagens" data-service="frog">
                <img src="frog.jpg" alt="sapo feliz">
            </article>
            <article class="imagens" data-service="carangueijo">
                <img src="crab.jpg" alt="carangueijo">
            </article>
            <article class="imagens"  data-service="teletubi">
                <img src="tele.png" alt="teletubi">
        </article>
        </div>
    </main>
    <div class="modal">
        <article class="modal-content">
            <button class="fechar" aria-label="Fechar modal">X</button>
        </article>
    </div>
    <script src="script.js"></script>
    </body>
</html>
